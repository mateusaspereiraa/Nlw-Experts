<!DOCTYPE html>
  <html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLW Experts</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');


*, :root {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
  font-synthesis: optimizeLegibility;
  -webkit-font-smootthing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}

body {
  background-color: #0F172A;
}

main {
  padding: 20px;
  max-width: 640px;
  margin: 0 auto 64px;
}

header{
  margin-top: 64px;
  padding-bottom: 24px;
  border-bottom: 1px solid #334155;
}
header h1{
  margin-top: 24px;
  font-size: 30px;
  color: #f1f5f9;
}

#quiz {
  counter-reset: quiz-item;
}

.quiz-item {
  margin-top: 24px;
  border: 1px solid #475569;
  border-radius: 6px;
  overflow: hidden;
}
.quiz-item h3 {
  padding: 16px 20px;
  color: #e2e8f0;
  display: flex;
  align-items: center;
  gap: 12px;
  background-color: #1e293b;
}
.quiz-item h3:before {
  counter-increment: quiz-item;
  content: counter(quiz-item);
  background-color: #475569;
  width: 28px;
  height: 28px;
  font-size: 12px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.quiz-item dl {
  padding: 20px 24px;
  display: grid;
  gap: 8px;
}
.quiz-item dl dt {
  font-size: 14px;
  line-height: 24px;
  letter-spacing: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #E2E3F0;
}

input {
  all: unset;
  border: 1px solid #94a3b8;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0; 
}

input:checked {
  border: 1px solid #A3E635;
}

input:checked:before {
  content: "";
  width: 10px;
  height: 10px;
  background-color: #A3E635;
  border-radius: 50%;
}



#acertos {
  text-align: center;
  background-color: #A3E635;

  position: fixed;
  bottom: 0;
  left: 0;

  width: 100%;
  padding: 12px;
}
</style>
  </head>
  <body>
    <main>

      <header>
        <img src=https://gist.githubusercontent.com/maykbrito/f47569e32fb2b21f2ecc9f4c035c141f/raw/a45997404564112d7596fbb1b9cad5de5521927e/logo.svg alt="Logo NLW">
        <h1> Teste seus conhecimentos </h1>
      </header>
    
      <div id="quiz"></div>
    
      <template>  
          <div class="quiz-item">
            <h3>
            Pergunta 01
            </h3>
            <dl>
            <dt> 
              <input type="radio" name="item" value="0">
              <span>
              Resposta A
              </span> 
            </dt>
          </dl>
        </div>
      </template>
    
      <div id="acertos">
        <strong>Acertos</strong>
        <span>0 de 10</span>
      </div>
    
    </main>
    <script>
const perguntas = [
    {
      pergunta: "O que é JavaScript?",
      respostas: [
        "Uma linguagem de marcação",
        "Uma linguagem de programação",
        "Um banco de dados",
      ],
      correta: 1
    },
    {
      pergunta: "Qual é a forma correta de declarar uma variável em JavaScript?",
      respostas: [
        "variable name = value",
        "var name = value",
        "v name = value",
      ],
      correta: 1
    },
    {
      pergunta: "Qual função é usada para imprimir uma mensagem no console em JavaScript?",
      respostas: [
        "console.log()",
        "print()",
        "log.console()",
      ],
      correta: 0
    },
    {
      pergunta: "Qual é o operador de igualdade estrita em JavaScript?",
      respostas: [
        "==",
        "===",
        "=",
      ],
      correta: 1
    },
    {
      pergunta: "O que o método 'querySelector()' faz em JavaScript?",
      respostas: [
        "Seleciona um elemento pelo seu ID",
        "Seleciona um elemento pelo seu nome de classe",
        "Seleciona um elemento pelo seletor CSS",
      ],
      correta: 2
    },
    {
      pergunta: "Qual método é usado para adicionar um elemento ao final de um array em JavaScript?",
      respostas: [
        "push()",
        "add()",
        "append()",
      ],
      correta: 0
    },
    {
      pergunta: "Qual é a palavra-chave usada para declarar uma função em JavaScript?",
      respostas: [
        "function",
        "method",
        "func",
      ],
      correta: 0
    },
    {
      pergunta: "Qual método é usado para remover o último elemento de um array em JavaScript?",
      respostas: [
        "pop()",
        "remove()",
        "delete()",
      ],
      correta: 0
    },
    {
      pergunta: "Qual é a função do operador 'typeof' em JavaScript?",
      respostas: [
        "Retorna o tipo de uma variável",
        "Verifica se duas variáveis são do mesmo tipo",
        "Converte o tipo de uma variável",
      ],
      correta: 0
    },
    {
      pergunta: "Qual é a estrutura de controle usada para tomar decisões em JavaScript?",
      respostas: [
        "if...else",
        "for",
        "switch",
      ],
      correta: 0
    }
  ];
  const quiz = document.querySelector('#quiz')
  const template = document.querySelector('template')
  
  const corretas = new Set()
  const totalDePerguntas = perguntas.length
  const mostrarTotal = document.querySelector('#acertos span')
  mostrarTotal.textContent = corretas.size + ' de ' + totalDePerguntas
  
  //loop ou laço de repetição
  for(const item of perguntas) {
    const quizItem = template.content.cloneNode(true)
    quizItem.querySelector('h3').textContent = item.pergunta
  
    for (let resposta of item.respostas) {
      const dt = quizItem.querySelector('dl dt').cloneNode(true)
      dt.querySelector('span').textContent = resposta
      dt.querySelector('input').setAttribute('name', 'pergunta-' 
      + perguntas.indexOf(item))
      dt.querySelector('input').value = item.respostas.indexOf(resposta)
      
      dt.querySelector('input').onchange = (event) => {
        const estaCorreta = event.target.value == item.correta
  
        corretas.delete(item)
        if(estaCorreta) {
          corretas.add(item)
        }
  
        mostrarTotal.textContent = corretas.size + ' de ' 
        + totalDePerguntas
        
      }
      
      
      quizItem.querySelector('dl').appendChild(dt)
      
    }
  
    quizItem.querySelector('dl dt').remove()
    
  
  // coloca a pergunta na tela
  quiz.appendChild(quizItem)
  }
</script>

<script id="login-gate">
(function(){
 var K="pm_users",S="pm_session",d=document;
 function ld(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}

 function css(){var s=d.createElement("style");s.textContent="#lg .lgi{display:block;max-height:64px;max-width:220px;margin:0 auto 6px;object-fit:contain;border-radius:8px}#lg .lgn{text-align:center;font-weight:800;font-size:1.2rem;margin-bottom:10px;letter-spacing:.02em}#lg{position:fixed;inset:0;z-index:2147483647;background:rgba(10,16,24,.94);display:flex;align-items:center;justify-content:center;padding:16px;font:15px/1.5 system-ui,sans-serif}#lg .c{background:#fff;color:#14202c;border-radius:14px;padding:22px;width:min(360px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}#lg h2{margin:0 0 4px;font-size:1.25rem}#lg p{margin:0 0 12px;color:#5a6878;font-size:.9rem}#lg .t{display:flex;gap:6px;margin-bottom:12px}#lg .t button{flex:1;padding:8px;border:1px solid #c9d3de;background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;color:#14202c}#lg .t button.on{background:#2354e6;color:#fff;border-color:#2354e6}#lg input{width:100%;padding:10px;margin:5px 0;border:1px solid #c9d3de;border-radius:8px;font:inherit;color:#14202c;background:#fff}#lg .go{width:100%;margin-top:8px;padding:11px;border:0;border-radius:8px;background:#2354e6;color:#fff;font:inherit;font-weight:700;cursor:pointer}#lg .e{color:#c0392b;min-height:1.3em;font-size:.85rem;margin-top:6px}#lgo{position:fixed;top:8px;right:8px;z-index:2147483646;padding:6px 10px;border:0;border-radius:8px;background:rgba(20,32,44,.85);color:#fff;font:600 12px system-ui,sans-serif;cursor:pointer}";var L=window.GATE_LOGO||{};if(L.c)s.textContent+="#lg .go,#lg .t button.on{background:"+L.c+";border-color:"+L.c+"}#lg .lgn span{color:"+L.c+"}";d.head.appendChild(s)}
 function out(){var o=d.getElementById("lgo");if(o)o.remove()}

 function ok(em){var g=d.getElementById("lg");if(g)g.remove();d.documentElement.style.overflow="";var b=d.createElement("button");b.id="lgo";b.textContent="Sair ("+em+")";b.onclick=sair;d.body.appendChild(b)}
 function lgLogo(){var L=window.GATE_LOGO||{};return (L.img?'<img class="lgi" src="'+L.img+'" alt="Logotipo" onerror="this.style.display=\'none\'">':"")+(L.n?'<div class="lgn">'+L.n+"</div>":"")}
 function show(){css();d.documentElement.style.overflow="hidden";var m="in",g=d.createElement("div");g.id="lg";
  g.innerHTML='<div class="c">'+lgLogo()+'<h2>Acesso ao sistema</h2><p>Entre com sua conta ou crie uma nova.</p><div class="t"><button class="on" data-m="in">Entrar</button><button data-m="up">Criar conta</button></div><input id="lge" type="email" placeholder="E-mail" autocomplete="username"><input id="lgp" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password"><div class="e" id="lgx"></div><button class="go" id="lgb">Entrar</button></div>';
  d.body.appendChild(g);var x=g.querySelector("#lgx");
  g.querySelectorAll(".t button").forEach(function(b){b.onclick=function(){m=b.dataset.m;g.querySelectorAll(".t button").forEach(function(o){o.classList.toggle("on",o===b)});g.querySelector("#lgb").textContent=m==="in"?"Entrar":"Criar conta";x.textContent=""}});
  async function sub(){var em=g.querySelector("#lge").value.trim().toLowerCase(),pw=g.querySelector("#lgp").value,u=ld(K)||{};
   if(!/^\S+@\S+\.\S+$/.test(em)){x.textContent="Digite um e-mail válido.";return}
   if(pw.length<6){x.textContent="A senha precisa ter ao menos 6 caracteres.";return}
   var h=await hs(em+pw);
   if(m==="up"){if(u[em]){x.textContent="Este e-mail já tem conta. Use Entrar.";return}u[em]=h;sv(K,u)}
   else if(!u[em]||u[em]!==h){x.textContent=u[em]?"Senha incorreta.":"Conta não encontrada. Use Criar conta.";return}
   sv(S,{e:em});ok(em)}
  g.querySelector("#lgb").onclick=sub;g.addEventListener("keydown",function(e){if(e.key==="Enter")sub()})}
 function start(){var s=ld(S);if(s&&s.e){css();ok(s.e)}else show()}
 if(d.body)start();else d.addEventListener("DOMContentLoaded",start)
})();
</script>
